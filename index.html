
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Equipment Reservation System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f1f5f9;
      color: #1e293b;
    }
    header {
      background: #12345a;
      color: white;
      text-align: center;
      padding: 24px 12px;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: white;
    }
    button {
      background: #1769aa;
      color: white;
      border: 0;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    main {
      max-width: 1000px;
      margin: auto;
      padding: 16px;
    }
    section {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 10px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0 14px;
      box-sizing: border-box;
    }
    .equipment-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .item {
      border: 1px solid #dbe3ec;
      padding: 12px;
      border-radius: 8px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
<header>
  <h1>Sports Equipment Reservation System</h1>
  <p>Sports and Development Office</p>
</header>
<nav>
  <button onclick="showPage('inventory')">Equipment</button>
  <button onclick="showPage('reservation')">Reservation</button>
  <button onclick="showPage('admin')">Admin</button>
</nav>
<main>
  <section id="inventory">
    <h2>Sports Equipment Inventory</h2>
    <div id="equipmentList" class="equipment-list"></div>
  </section>
  <section id="reservation" class="hidden">
    <h2>Make a Reservation</h2>
    <form id="reservationForm">
      <label>Student Name</label>
      <input id="studentName" required>
      <label>Student ID</label>
      <input id="studentId" required>
      <label>Equipment</label>
      <select id="equipmentChoice" required></select>
      <label>Quantity</label>
      <input id="quantity" type="number" min="1" value="1" required>
      <label>Reservation Date</label>
      <input id="reservationDate" type="date" required>
      <label>Expected Return Date</label>
      <input id="returnDate" type="date" required>
      <button type="submit">Submit Reservation</button>
    </form>
    <p id="message"></p>
  </section>
  <section id="admin" class="hidden">
    <h2>Admin Dashboard</h2>
    <p>Reservation requests and inventory management will appear here.</p>
    <div id="requests"></div>
  </section>
</main>
</body>
</html>
